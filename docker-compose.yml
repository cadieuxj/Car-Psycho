services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: carpsycho-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpsycho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpsycho_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-carpsycho}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpsycho"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carpsycho-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: carpsycho-chromadb
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=${CHROMA_AUTH_PROVIDER:-chromadb.auth.token.TokenAuthCredentialsProvider}
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-carpsycho_token}
      - CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER=${CHROMA_HEADER:-X-Chroma-Token}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - carpsycho-network

  # Redis for caching, pub/sub metrics streaming, and job coordination
  redis:
    image: redis:7-alpine
    container_name: carpsycho-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carpsycho-network

  # Manager Service - Training orchestration, model registry
  manager-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: services/manager
    container_name: carpsycho-manager
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carpsycho}:${POSTGRES_PASSWORD:-carpsycho_dev_pass}@postgres:5432/${POSTGRES_DB:-carpsycho}
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=manager
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - T4_VM_HOST=${T4_VM_HOST}
      - T4_VM_USER=${T4_VM_USER}
      - T4_VM_SSH_KEY_PATH=/app/ssh/id_rsa
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carpsycho-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Inference Service - Model serving & predictions
  inference-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: services/inference
    container_name: carpsycho-inference
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carpsycho}:${POSTGRES_PASSWORD:-carpsycho_dev_pass}@postgres:5432/${POSTGRES_DB:-carpsycho}
      - CHROMA_URL=http://chromadb:8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN:-carpsycho_token}
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=inference
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODELS_DIR=/app/models
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - carpsycho-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Data Service - Dataset management & pipeline
  data-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_DIR: services/data
    container_name: carpsycho-data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carpsycho}:${POSTGRES_PASSWORD:-carpsycho_dev_pass}@postgres:5432/${POSTGRES_DB:-carpsycho}
      - CHROMA_URL=http://chromadb:8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN:-carpsycho_token}
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=data
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TEACHER_MODEL=${TEACHER_MODEL:-gpt-4o}
      - DATA_DIR=/app/data
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - carpsycho-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: carpsycho-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - carpsycho-network
    command: npm run dev

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: carpsycho-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - manager-service
      - inference-service
      - data-service
    networks:
      - carpsycho-network

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local

networks:
  carpsycho-network:
    driver: bridge
